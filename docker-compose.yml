# Mandaflix — full stack: Postgres (pgvector) + FastAPI (serving the built frontend).
# The app is exposed only on localhost:8000; a Cloudflare Tunnel fronts it publicly.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: mandaflix
      POSTGRES_DB: mandaflix
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:mandaflix@db:5432/mandaflix
      HF_HUB_OFFLINE: "1"          # use the image-baked model only; never ping HF
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # local smoke tests; public access is via the tunnel
    restart: unless-stopped

  # Dedicated Cloudflare tunnel for mandaflix (isolated from cannabase/travatar).
  # Public hostname (mandaflix.krystianjarmul.dev → http://app:8000) is set in
  # the Cloudflare dashboard; TUNNEL_TOKEN comes from a local .env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
